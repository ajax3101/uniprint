[project]
name = "uniprint"
version = "0.1.0"
description = "University print and cartridge lifecycle management"
readme = "README.md"
authors = [
    { name = "Denys Morozov", email = "ajax3101@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi[standard]>=0.162.2",
    "psycopg[binary]>=3.2",
    "qrcode>=8,<9",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
uniprint = "uniprint:main"
uniprint-dev-user = "uniprint.devtools:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]
